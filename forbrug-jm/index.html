<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Min strøm</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Min strøm">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" href="../icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
/* Layout: iOS-style dark app — area pill, large title, segmented tabs, rounded card with three stats and one thin bar per hour */
:root {
  --bg: #000000;
  --panel: #1c1c1e;
  --raised: #2c2c2e;
  --fg: #ffffff;
  --muted: #8e8e93;
  --line: #38383a;
  --track: #2a2a2d;
  --grid: rgb(255 255 255 / .05);
  --tab-on: #e9e9ee;
  --blue: #2f8cff;
  --accent: #ffd60a;
  --cheap: #3c9a4c;
  --mid: #d9a520;
  --dear: #d9503c;
  --display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 28px);
  display: flex; flex-direction: column; gap: 14px;
}
header { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
h1 { margin: 0; font: 800 34px/1 var(--display); letter-spacing: -.01em; }
.seg { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; box-shadow: 0 2px 10px rgb(0 0 0 / .4); }
.seg svg { width: 17px; height: 17px; margin: 0 4px 0 9px; color: var(--fg); flex: none; }
.seg button { font: 700 14px/1 var(--display); color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 7px 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* Segmented tabs */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 2px; }
.tabs button {
  font: 600 14px/1 var(--display); color: var(--muted); background: none; border: 0; border-radius: 10px;
  padding: 9px 6px; cursor: pointer; position: relative;
}
.tabs button + button::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.tabs button[aria-selected="true"] { background: var(--tab-on); color: var(--blue); font-weight: 800; }
.tabs button[aria-selected="true"]::before, .tabs button[aria-selected="true"] + button::before { display: none; }

.dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 4px 14px 0; }
.dayhead h2 { margin: 0; font: 700 17px/1.2 var(--display); color: var(--muted); }
.fc-tag { color: var(--accent); font-size: 13px; font-weight: 600; }
.note { font-size: 13px; color: var(--muted); padding-inline: 4px; }

/* Card */
.card { background: var(--panel); border-radius: 20px; padding: 14px 14px 10px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; text-align: center; padding-bottom: 10px; }
.stat b { display: block; font: 800 18px/1.15 var(--display); font-variant-numeric: tabular-nums; }
.stat span { display: inline-flex; align-items: center; gap: 4px; font: 500 13px/1.3 var(--display); color: var(--muted); margin-top: 1px; }
.stat.now b { color: var(--accent); }
.ic { width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.ic svg { width: 10px; height: 10px; }
.ic.down { background: rgb(60 154 76 / .25); color: #4cd964; }
.ic.up { background: rgb(255 214 10 / .2); color: var(--accent); }
.ic.now { background: var(--accent); color: #000; }

.hours { display: flex; flex-direction: column; }
.hrow { display: grid; grid-template-columns: 22px 1fr 40px; gap: 10px; align-items: center; height: 21px; font-variant-numeric: tabular-nums; }
.hrow.head { height: 18px; font: 500 12px/1 var(--display); color: var(--muted); }
.hrow.head span:last-child { text-align: right; }
.hh { font: 600 13px/1 var(--display); color: var(--muted); }
.track {
  height: 8px; border-radius: 4px; overflow: visible; position: relative;
  background:
    linear-gradient(90deg, transparent calc(25% - .5px), var(--grid) calc(25% - .5px) calc(25% + .5px), transparent calc(25% + .5px),
      transparent calc(50% - .5px), var(--grid) calc(50% - .5px) calc(50% + .5px), transparent calc(50% + .5px),
      transparent calc(75% - .5px), var(--grid) calc(75% - .5px) calc(75% + .5px), transparent calc(75% + .5px)) 0 -7px / 100% 21px no-repeat,
    var(--track);
}
.fill { height: 100%; border-radius: 4px; background: var(--lvl); min-width: 6px; }
.fc .fill { background: repeating-linear-gradient(135deg, var(--lvl) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--lvl); }
.hv { text-align: right; font: 600 13px/1 var(--display); color: var(--muted); }
.lvl-cheap { --lvl: var(--cheap); } .lvl-mid { --lvl: var(--mid); } .lvl-dear { --lvl: var(--dear); }
.hrow.cur .hh, .hrow.cur .hv { color: var(--fg); font-weight: 800; }

.tip { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; background: var(--panel); border-radius: 16px; padding: 10px 14px; }
.tip .t { font-size: 12px; color: var(--muted); width: 100%; }
.tip b { font: 700 16px/1.2 var(--display); }
.tip .p { color: #4cd964; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Week ledger */
.days { display: flex; flex-direction: column; background: var(--panel); border-radius: 18px; overflow: hidden; }
.drow {
  display: grid; grid-template-columns: 76px 1fr 48px; gap: 10px; align-items: center;
  padding: 9px 14px; border: 0; border-top: 1px solid var(--line); background: none; color: inherit;
  font: inherit; text-align: left; cursor: pointer; width: 100%;
}
.drow:first-child { border-top: 0; }
.dname { font: 700 14px/1.1 var(--display); }
.dname small { display: block; font: 500 11px/1.3 var(--body); color: var(--muted); }
.chev { display: inline-block; margin-left: 4px; color: var(--muted); font-size: 10px; transition: transform .15s; }
.drow[aria-expanded="true"] .chev { transform: rotate(90deg); }
.range { position: relative; height: 6px; border-radius: 4px; background: var(--track); }
.range .r { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, var(--cheap), var(--mid), var(--dear)); }
.range .a { position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: 2px; background: var(--fg); }
.range-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; font-variant-numeric: tabular-nums; }
.davg { text-align: right; font: 700 14px/1 var(--display); font-variant-numeric: tabular-nums; }
.davg small { display: block; font: 500 11px/1.4 var(--body); color: var(--muted); }
.dexp { padding: 4px 14px 10px; border-top: 1px solid var(--line); }

.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); padding-inline: 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

footer { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; padding-inline: 4px; }
footer a { color: inherit; }
.err { background: var(--panel); border: 1px solid var(--dear); border-radius: 16px; padding: 12px 14px; font-size: 14px; }
.err button { margin-top: 8px; }
.btn { font: 600 14px/1 var(--body); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); cursor: pointer; }
.empty { padding: 18px 4px; color: var(--muted); text-align: center; }

.check { display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border-radius: 16px; padding: 10px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
/* Consumption tab */
.hrow.use { grid-template-columns: 22px 1fr 44px 44px; }
.hrow.use .kwh { text-align: right; font: 600 13px/1 var(--display); color: var(--fg); }
.drow.use { grid-template-columns: 76px 1fr 62px; }
.ubar { height: 6px; border-radius: 4px; background: var(--track); }
.ubar div { height: 100%; border-radius: 4px; background: var(--blue); min-width: 4px; }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sum div { background: var(--panel); border-radius: 16px; padding: 10px 14px; }
.sum span { display: block; font-size: 12px; color: var(--muted); }
.sum b { font: 800 18px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.sum small { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.setup { display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.setup ol { margin: 0; padding-left: 20px; color: var(--muted); }
.setup ol li { margin: 3px 0; }
.setup textarea, .setup select { width: 100%; font: 13px/1.3 ui-monospace, monospace; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.setup textarea { height: 76px; resize: vertical; }
.setup select { font-family: var(--body); }
.linkbtn { background: none; border: 0; color: var(--blue); font: inherit; padding: 0; cursor: pointer; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: #34c759; flex: none; }
.check small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seg" role="group" aria-label="Prisområde">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h4.5v-5.5h4v5.5h4.5V10"/></svg>
      <button type="button" data-area="DK1" aria-pressed="true">Vest</button>
      <button type="button" data-area="DK2" aria-pressed="false">Øst</button>
    </div>
    <h1>Elpriser</h1>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="today" aria-selected="true">I dag</button>
    <button type="button" role="tab" data-tab="tomorrow" aria-selected="false">I morgen</button>
    <button type="button" role="tab" data-tab="week" aria-selected="false">7 dage</button>
    <button type="button" role="tab" data-tab="usage" aria-selected="false">Forbrug</button>
  </div>

  <div id="errBox" hidden></div>
  <main id="panel" style="display:flex;flex-direction:column;gap:14px"><div class="empty">Henter priser …</div></main>

  <div class="legend">
    <span><i style="background:var(--cheap)"></i>Billig</span>
    <span><i style="background:var(--mid)"></i>Middel</span>
    <span><i style="background:var(--dear)"></i>Dyr</span>
    <span><i style="background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 4px);box-shadow:inset 0 0 0 1px var(--muted)"></i>Prognose</span>
  </div>

  <label class="check" for="heatChk"><input type="checkbox" id="heatChk">
    <span>Reduceret elafgift (elvarme eller varmepumpe)
      <small>Gælder forbrug over 4.000 kWh om året. I 2026 og 2027 er elafgiften ca. 1 øre/kWh for alle, så valget ændrer først prisen fra 2028.</small></span></label>

  <footer>
    <div id="updated"></div>
    <div>Pris pr. kWh inkl. spotpris, nettarif, systemtarif, elafgift og moms. Dit elselskabs eget tillæg og abonnement er ikke med. Priser efter i morgen er prognoser. Data fra <a href="https://stromligning.dk" target="_blank" rel="noopener">Strømligning</a>.</div>
  </footer>
</div>


<script>
(() => {
  const API = "https://stromligning.dk/api";
  const MAX_AGE = 30 * 60 * 1000;
  // Prisområde → netselskab der bruges til nettariffen
  const AREAS = {
    DK1: { name: "Vestdanmark", net: "trefor_el-net_c", netName: "TREFOR El-net" },
    DK2: { name: "Østdanmark", net: "radius_c", netName: "Radius" }
  };

  const $ = id => document.getElementById(id);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const kr = v => v.toLocaleString("da-DK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const WD = ["søndag","mandag","tirsdag","onsdag","torsdag","fredag","lørdag"];
  const MO = ["januar","februar","marts","april","maj","juni","juli","august","september","oktober","november","december"];
  const pad = n => String(n).padStart(2, "0");
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const dateOf = key => { const [y,m,d] = key.split("-").map(Number); return new Date(y, m-1, d); };
  const todayKey = () => keyOf(new Date());
  const tomorrowKey = () => { const t = new Date(); return keyOf(new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1)); };
  const relDay = key => key === todayKey() ? "I dag" : key === tomorrowKey() ? "I morgen" : cap(WD[dateOf(key).getDay()]);
  const longDate = key => { const d = dateOf(key); return `${WD[d.getDay()]} ${d.getDate()}. ${MO[d.getMonth()]}`; };
  const shortDate = key => { const d = dateOf(key); return `${d.getDate()}. ${MO[d.getMonth()].slice(0, 3)}`; };
  const cap = s => s[0].toUpperCase() + s.slice(1);
  const svg = d => `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICON = {
    down: `<i class="ic down" aria-label="lavest">${svg('<path d="M6 2v8M2.5 6.5 6 10l3.5-3.5"/>')}</i>`,
    up: `<i class="ic up" aria-label="højest">${svg('<path d="M6 10V2M2.5 5.5 6 2l3.5 3.5"/>')}</i>`,
    now: `<i class="ic now">${'<svg viewBox="0 0 12 12"><path d="M7 1 2.5 7H6l-1 4 4.5-6H6z" fill="currentColor"/></svg>'}</i>`
  };

  let area = store.get("area") === "DK2" ? "DK2" : "DK1";
  const netId = () => AREAS[area].net;
  let data = null;
  let hours = [];
  let tab = "today";
  let heat = store.get("heat") ?? true;   // reduceret elafgift for elvarme, standard: til
  const MIN_TAX = 0.01;                   // EU-minimum 0,8 øre + moms
  const priceOf = p => heat ? p.v - p.tax + Math.min(p.tax, MIN_TAX) : p.v;
  const openDays = new Set();

  // ---------- forbrug (Eloverblik) ----------
  const ELO = "https://api.eloverblik.dk/customerapi/api";
  const USE_MAX_AGE = 3 * 3600e3;
  let eloToken = store.get("eloToken") || "";   // refresh-token fra eloverblik.dk, gemmes kun på enheden
  let mpId = store.get("eloMp") || "";
  let mps = store.get("eloMps") || [];
  let use = store.get("use");                     // { fetched, mpId, pts: [{t, q}] } pr. time
  let hist = store.get("hist");                   // historiske priser til at regne kr
  let useErr = "", useLoading = false, useDay = null;
  const openUseDays = new Set();

  async function eloAccess(renew) {
    const c = store.get("eloAccess");
    if (!renew && c && c.ref === eloToken.slice(-16) && Date.now() - c.t < 20 * 3600e3) return c.token;
    const res = await fetch(`${ELO}/token`, { headers: { Authorization: "Bearer " + eloToken } });
    if (res.status === 401 || res.status === 403) throw new Error("token");
    if (!res.ok) throw new Error("elo " + res.status);
    const token = (await res.json()).result;
    store.set("eloAccess", { token, t: Date.now(), ref: eloToken.slice(-16) });
    return token;
  }
  async function eloPost(path, body, retry = true) {
    const res = await fetch(ELO + path, {
      method: "POST",
      headers: { Authorization: "Bearer " + await eloAccess(!retry), "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 401 && retry) return eloPost(path, body, false);
    if (res.status === 401 || res.status === 403) throw new Error("token");
    if (!res.ok) throw new Error("elo " + res.status);
    return res.json();
  }

  async function fetchMeteringPoints() {
    const j = await eloPost("/meteringpoints/meteringpoints?includeAll=false");
    mps = (j.result || []).filter(m => !m.typeOfMP || m.typeOfMP === "E17").map(m => ({
      id: m.meteringPointId,
      addr: [[m.streetName, m.buildingNumber].filter(Boolean).join(" "), [m.postcode, m.cityName].filter(Boolean).join(" ")].filter(Boolean).join(", ")
    }));
    store.set("eloMps", mps);
    if (!mps.some(m => m.id === mpId)) { mpId = mps[0]?.id || ""; store.set("eloMp", mpId); }
    if (!mpId) throw new Error("nomp");
  }

  // fra den 1. i sidste måned til og med i går
  const useRange = () => { const t = new Date(); return [new Date(t.getFullYear(), t.getMonth() - 1, 1), new Date(t.getFullYear(), t.getMonth(), t.getDate())]; };

  async function fetchUsage() {
    const [from, to] = useRange();
    const j = await eloPost(`/meterdata/gettimeseries/${keyOf(from)}/${keyOf(to)}/Hour`, { meteringPoints: { meteringPoint: [mpId] } });
    const m = new Map();
    for (const r of j.result || []) {
      if (r.success === false) throw new Error("elo " + (r.errorText || "fejl"));
      for (const ts of r.MyEnergyData_MarketDocument?.TimeSeries || []) {
        for (const per of [].concat(ts.Period || [])) {
          const start = Date.parse(per.timeInterval.start);
          const min = { PT15M: 15, PT1H: 60, P1D: 1440 }[per.resolution] || 60;
          for (const pt of [].concat(per.Point || [])) {
            const t = start + (pt.position - 1) * min * 60e3, h = t - t % 36e5;
            m.set(h, (m.get(h) || 0) + (parseFloat(pt["out_Quantity.quantity"]) || 0));
          }
        }
      }
    }
    use = { fetched: Date.now(), mpId, pts: [...m].sort((a, b) => a[0] - b[0]).map(([t, q]) => ({ t, q })) };
    store.set("use", use);
  }

  async function fetchHistPrices() {
    const [from, to] = useRange();
    const url = `${API}/prices?supplierId=${encodeURIComponent(netId())}&from=${from.toISOString()}&to=${to.toISOString()}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status === 429 ? "rate" : "http " + res.status);
    const j = await res.json();
    hist = { fetched: Date.now(), netId: netId(), from: keyOf(from), prices: (j.prices || []).map(p => ({
      t: Date.parse(p.date), v: p.price.total, tax: p.details?.electricityTax?.total ?? 0
    })) };
    store.set("hist", hist);
  }

  async function loadUsage(force) {
    if (!eloToken || useLoading) return;
    const stale = !use || use.mpId !== mpId || Date.now() - use.fetched > USE_MAX_AGE;
    const hStale = !hist || hist.netId !== netId() || hist.from !== keyOf(useRange()[0]) || Date.now() - hist.fetched > 12 * 3600e3;
    if (!force && !stale && !hStale) return;
    useLoading = true; useErr = ""; render();
    try {
      if (!mpId || force) await fetchMeteringPoints();
      await Promise.all([(force || stale) && fetchUsage(), (force || hStale) && fetchHistPrices()]);
    } catch (e) {
      useErr = e.message === "token" ? "Eloverblik afviste din token. Den er måske udløbet (de gælder et år) eller kopieret forkert. Lav en ny og indsæt den igen."
        : e.message === "nomp" ? "Der blev ikke fundet nogen målere på din token. Tjek at din adresse er tilknyttet i Eloverblik."
        : e.message === "rate" ? "For mange opdateringer på kort tid. Prøv igen om lidt."
        : "Kunne ikke hente forbrug fra Eloverblik. Deres service er af og til nede, så prøv igen senere.";
    } finally { useLoading = false; render(); }
  }

  // ---------- data ----------
  async function fetchPrices() {
    const t = new Date();
    const from = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const to = new Date(from.getTime() + 8 * 864e5);
    const url = `${API}/prices?supplierId=${encodeURIComponent(netId())}&forecast=true&from=${from.toISOString()}&to=${to.toISOString()}`;
    const res = await fetch(url);
    if (res.status === 429) throw new Error("rate");
    if (!res.ok) throw new Error("http " + res.status);
    const j = await res.json();
    if (!j.prices || !j.prices.length) throw new Error("empty");
    data = { fetched: Date.now(), netId: netId(), prices: j.prices.map(p => ({
      t: Date.parse(p.date), local: p.localDate, v: p.price.total, tax: p.details?.electricityTax?.total ?? 0,
      res: p.resolution === "15m" ? 15 : 60, fc: !!p.forecast
    })) };
    store.set("prices2", data);
  }

  // 15-min prices are averaged into whole hours, keyed by local date + hour
  function aggregate() {
    const m = new Map();
    for (const p of data.prices) {
      const k = p.local.slice(0, 13);
      if (!m.has(k)) m.set(k, { day: p.local.slice(0, 10), h: +p.local.slice(11, 13), t: p.t, sum: 0, n: 0, fc: false });
      const e = m.get(k); e.sum += priceOf(p); e.n++; e.fc = e.fc || p.fc; e.t = Math.min(e.t, p.t);
    }
    hours = [...m.values()].sort((a, b) => a.t - b.t).map(e => ({ ...e, v: e.sum / e.n }));
    hours.forEach((h, i) => h.i = i);
  }

  // ---------- render ----------
  let L = { lo: 0, hi: 0 };
  function computeLevels() {
    const vals = hours.map(h => h.v).sort((a, b) => a - b);
    const q = f => vals[Math.min(vals.length - 1, Math.floor(f * vals.length))];
    L = { lo: q(1/3), hi: q(2/3) };
  }
  const lvl = v => v <= L.lo ? "cheap" : v >= L.hi ? "dear" : "mid";
  const curIndex = () => { const now = Date.now(); return hours.findIndex(h => h.t <= now && now < h.t + 36e5); };
  const dayHours = key => hours.filter(h => h.day === key);
  // timer der er helt overstået vises ikke; den igangværende time står øverst
  const upcoming = list => { const now = Date.now(); return list.filter(h => h.t + 36e5 > now); };

  function hourList(list) {
    list = upcoming(list);
    const ci = curIndex();
    const max = Math.max(...list.map(h => h.v), 0.01);
    return `<div class="hours"><div class="hrow head"><span>Kl.</span><span></span><span>kr/kWh</span></div>` +
      list.map(h => {
        const c = ["hrow", "lvl-" + lvl(h.v)];
        if (h.fc) c.push("fc");
        if (h.i === ci) c.push("cur");
        const w = Math.max(3, Math.max(0, h.v) / max * 100);
        return `<div class="${c.join(" ")}"><span class="hh">${pad(h.h)}</span><div class="track"><div class="fill" style="width:${w}%"></div></div><span class="hv">${kr(h.v)}</span></div>`;
      }).join("") + `</div>`;
  }

  function dayView(key) {
    const list = upcoming(dayHours(key));
    if (!list.length) {
      return `<div class="dayhead"><h2>${relDay(key)} - ${cap(longDate(key))}</h2></div>
        <div class="card"><div class="empty">Ingen priser endnu. Morgendagens priser kommer ca. kl. 13.</div></div>`;
    }
    const fc = list.some(h => h.fc);
    const lo = list.reduce((a, b) => b.v < a.v ? b : a), hi = list.reduce((a, b) => b.v > a.v ? b : a);
    const ci = curIndex();
    const cur = key === todayKey() && ci >= 0 ? hours[ci] : null;
    const avg = list.reduce((s, h) => s + h.v, 0) / list.length;
    const mid = cur
      ? `<div class="stat now"><b>${kr(cur.v)} kr</b><span>Lige nu ${ICON.now}</span></div>`
      : `<div class="stat"><b>${kr(avg)} kr</b><span>Snit</span></div>`;
    let tip = "";
    if (key === todayKey()) {
      const ahead = hours.slice(Math.max(0, ci), Math.max(0, ci) + 24);
      let best = null;
      for (let i = 0; i + 3 <= ahead.length; i++) {
        const a = (ahead[i].v + ahead[i+1].v + ahead[i+2].v) / 3;
        if (!best || a < best.a) best = { i, a };
      }
      if (best) {
        const s = ahead[best.i], e = ahead[best.i + 2];
        tip = `<div class="tip"><span class="t">Billigste 3 timer i det næste døgn</span><b>${relDay(s.day)} kl. ${pad(s.h)}–${pad((e.h + 1) % 24)}</b><span class="p">snit ${kr(best.a)} kr</span></div>`;
      }
    }
    return `<div class="dayhead"><h2>${relDay(key)} - ${cap(longDate(key))}</h2>${fc ? '<span class="fc-tag">Prognose</span>' : ""}</div>
      ${fc && key === tomorrowKey() ? '<div class="note">Rigtige priser for i morgen kommer ca. kl. 13. Indtil da vises en prognose.</div>' : ""}
      <div class="card">
        <div class="stats">
          <div class="stat"><b>${kr(lo.v)} kr</b><span>Kl. ${pad(lo.h)}.00 ${ICON.down}</span></div>
          ${mid}
          <div class="stat"><b>${kr(hi.v)} kr</b><span>Kl. ${pad(hi.h)}.00 ${ICON.up}</span></div>
        </div>
        ${hourList(list)}
      </div>${tip}`;
  }

  function weekView() {
    const days = [...new Set(hours.map(h => h.day))];
    const gMin = Math.min(...hours.map(h => h.v)), gMax = Math.max(...hours.map(h => h.v));
    const span = Math.max(0.01, gMax - gMin);
    let rows = "";
    for (const day of days) {
      const list = dayHours(day), vs = list.map(h => h.v);
      const mn = Math.min(...vs), mx = Math.max(...vs), av = vs.reduce((a, b) => a + b, 0) / vs.length;
      const fc = list.some(h => h.fc), open = openDays.has(day);
      const left = (mn - gMin) / span * 100, width = Math.max(2, (mx - mn) / span * 100), a = (av - gMin) / span * 100;
      rows += `<button type="button" class="drow" data-day="${day}" aria-expanded="${open}">
        <div class="dname">${relDay(day)}<span class="chev">▶</span><small>${shortDate(day)}${fc ? ' · <span class="fc-tag" style="font-size:12px">prognose</span>' : ""}</small></div>
        <div><div class="range"><div class="r" style="left:${left}%;width:${width}%"></div><div class="a" style="left:calc(${a}% - 1.5px)"></div></div>
          <div class="range-l"><span>${kr(mn)}</span><span>${kr(mx)}</span></div></div>
        <div class="davg">${kr(av)}<small>snit</small></div>
      </button>` + (open ? `<div class="dexp">${hourList(list)}</div>` : "");
    }
    return `<div class="note">Tryk på en dag for at se prisen time for time.</div><div class="days" id="days">${rows}</div>`;
  }

  // timepris (kr/kWh) for hver hel time i perioden
  function histHourPrices() {
    const m = new Map();
    for (const p of hist?.prices || []) {
      const h = p.t - p.t % 36e5, e = m.get(h) || [0, 0];
      e[0] += priceOf(p); e[1]++; m.set(h, e);
    }
    return new Map([...m].map(([h, [s, n]]) => [h, s / n]));
  }
  const kwh = v => v.toLocaleString("da-DK", { minimumFractionDigits: v < 10 ? 2 : 1, maximumFractionDigits: v < 10 ? 2 : 1 });
  const krInt = v => Math.round(v).toLocaleString("da-DK");

  function usageSetup() {
    return `<div class="card setup">
      <b style="font:700 17px/1.2 var(--display)">Følg dit forbrug</b>
      <div>Appen kan hente dit forbrug time for time fra Eloverblik og regne ud, hvad strømmen har kostet. Det kræver en token, som du laver én gang:</div>
      <ol>
        <li>Log ind på <a href="https://eloverblik.dk/customer" target="_blank" rel="noopener" style="color:var(--blue)">eloverblik.dk</a> med MitID.</li>
        <li>Tryk på dit navn øverst til højre og vælg <b>Datadeling</b>.</li>
        <li>Vælg <b>Opret token</b>, giv den et navn og kopiér den lange kode.</li>
        <li>Indsæt den her.</li>
      </ol>
      <textarea id="tokIn" placeholder="Indsæt token fra Eloverblik" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      <button class="btn" type="button" id="tokSave">Gem og hent forbrug</button>
      <div class="note" style="padding:0">Token gemmes kun på denne enhed og sendes kun til Eloverblik.</div>
    </div>`;
  }

  function usageHours(list, hp) {
    const pv = list.map(h => hp.get(h.t)).filter(v => v != null).sort((a, b) => a - b);
    const q = f => pv[Math.min(pv.length - 1, Math.floor(f * pv.length))];
    const lo = q(1/3), hi = q(2/3);
    const max = Math.max(...list.map(h => h.q), 0.01);
    return `<div class="hours"><div class="hrow use head"><span>Kl.</span><span></span><span style="text-align:right">kWh</span><span>kr</span></div>` +
      list.map(h => {
        const p = hp.get(h.t), l = p == null ? "" : p <= lo ? "lvl-cheap" : p >= hi ? "lvl-dear" : "lvl-mid";
        const w = Math.max(3, h.q / max * 100);
        return `<div class="hrow use ${l}"><span class="hh">${pad(new Date(h.t).getHours())}</span><div class="track"><div class="fill" style="width:${w}%${l ? "" : ";background:var(--muted)"}"></div></div><span class="kwh">${kwh(h.q)}</span><span class="hv">${p == null ? "–" : kr(h.q * p)}</span></div>`;
      }).join("") + `</div>`;
  }

  function usageView() {
    if (!eloToken) return usageSetup();
    const err = useErr ? `<div class="err">${useErr}<br><button class="btn" type="button" id="useRetry">Prøv igen</button> <button class="btn" type="button" id="tokForget">Indsæt ny token</button></div>` : "";
    if (!use || use.mpId !== mpId || !use.pts.length) {
      return err + `<div class="card"><div class="empty">${useLoading ? "Henter dit forbrug fra Eloverblik …" : use ? "Eloverblik har ingen forbrugsdata for perioden endnu." : ""}</div></div>`;
    }
    const hp = histHourPrices();
    const byDay = new Map();
    for (const p of use.pts) {
      const k = keyOf(new Date(p.t));
      if (!byDay.has(k)) byDay.set(k, []);
      byDay.get(k).push(p);
    }
    const tot = list => list.reduce((a, h) => { const p = hp.get(h.t); a.q += h.q; if (p != null) { a.kr += h.q * p; a.qp += h.q; } return a; }, { q: 0, kr: 0, qp: 0 });
    const days = [...byDay.keys()].sort().reverse();
    if (!useDay || !byDay.has(useDay)) useDay = days[0];

    // måneder
    const now = new Date();
    const mKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    const thisM = mKey(now), prevM = mKey(new Date(now.getFullYear(), now.getMonth() - 1, 1));
    const monthTot = mk => tot(use.pts.filter(p => mKey(new Date(p.t)) === mk));
    const mBox = (mk, label) => {
      const t = monthTot(mk);
      return `<div><span>${label}</span><b>${krInt(t.kr)} kr</b><small>${kwh(t.q)} kWh${t.qp ? " · snit " + kr(t.kr / t.qp) + " kr" : ""}</small></div>`;
    };
    const mName = mk => cap(MO[+mk.slice(5) - 1]);

    // valgt dag
    const dl = byDay.get(useDay), dt = tot(dl);
    const cheapShare = (() => {
      const pv = dl.map(h => hp.get(h.t)).filter(v => v != null).sort((a, b) => a - b);
      if (!pv.length || !dt.q) return null;
      const lo = pv[Math.floor(pv.length / 3)];
      return Math.round(dl.filter(h => hp.get(h.t) != null && hp.get(h.t) <= lo).reduce((s, h) => s + h.q, 0) / dt.q * 100);
    })();

    const maxQ = Math.max(...days.map(d => tot(byDay.get(d)).q), 0.01);
    let rows = "";
    for (const d of days.slice(0, 31)) {
      const t = tot(byDay.get(d)), open = openUseDays.has(d);
      rows += `<button type="button" class="drow use" data-uday="${d}" aria-expanded="${open}">
        <div class="dname">${d === keyOf(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1)) ? "I går" : cap(WD[dateOf(d).getDay()])}<span class="chev">▶</span><small>${shortDate(d)}</small></div>
        <div><div class="ubar"><div style="width:${t.q / maxQ * 100}%"></div></div><div class="range-l"><span>${kwh(t.q)} kWh</span></div></div>
        <div class="davg">${kr(t.kr)}<small>kr</small></div>
      </button>` + (open ? `<div class="dexp">${usageHours(byDay.get(d), hp)}</div>` : "");
    }
    const mp = mps.find(m => m.id === mpId);
    return err + `<div class="sum">${mBox(thisM, mName(thisM) + " indtil nu")}${mBox(prevM, mName(prevM))}</div>
      <div class="dayhead"><h2>Seneste dag - ${cap(longDate(useDay))}</h2></div>
      <div class="card">
        <div class="stats">
          <div class="stat"><b>${kwh(dt.q)}</b><span>kWh</span></div>
          <div class="stat now"><b>${kr(dt.kr)} kr</b><span>Pris</span></div>
          <div class="stat"><b>${dt.qp ? kr(dt.kr / dt.qp) : "–"}</b><span>kr/kWh</span></div>
        </div>
        ${usageHours(dl, hp)}
      </div>
      ${cheapShare != null ? `<div class="tip"><span class="t">Andel af forbruget i dagens billigste timer</span><b>${cheapShare} %</b><span class="p">${cheapShare >= 40 ? "flot timet" : cheapShare >= 33 ? "gennemsnitligt" : "kan flyttes"}</span></div>` : ""}
      <div class="note">Seneste 31 dage. Tryk på en dag for at se forbruget time for time. Eloverblik er typisk 1-2 dage bagud.</div>
      <div class="days">${rows}</div>
      <div class="note">${mps.length > 1 ? `<select id="mpSel" class="btn" style="width:100%;margin-bottom:8px">${mps.map(m => `<option value="${m.id}"${m.id === mpId ? " selected" : ""}>${m.addr || m.id}</option>`).join("")}</select>` : mp ? `Måler: ${mp.addr || mp.id}<br>` : ""}
        ${useLoading ? "Opdaterer …" : `Hentet kl. ${pad(new Date(use.fetched).getHours())}:${pad(new Date(use.fetched).getMinutes())}`} · <button class="linkbtn" type="button" id="useRefresh">Opdater</button> · <button class="linkbtn" type="button" id="tokForget">Fjern token</button></div>`;
  }

  function render() {
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
    document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.area === area));
    $("heatChk").checked = heat;
    if (tab === "usage") { $("panel").innerHTML = usageView(); return; }
    if (!data) { $("panel").innerHTML = '<div class="empty">Henter priser …</div>'; return; }
    aggregate(); computeLevels();
    $("panel").innerHTML = tab === "today" ? dayView(todayKey()) : tab === "tomorrow" ? dayView(tomorrowKey()) : weekView();
    const f = new Date(data.fetched);
    $("updated").textContent = `Opdateret kl. ${pad(f.getHours())}:${pad(f.getMinutes())} · ${AREAS[area].name} (nettarif fra ${AREAS[area].netName}) · ${heat ? "reduceret elafgift (elvarme)" : "fuld elafgift"}`;
  }

  function showError(msg) {
    $("errBox").hidden = false;
    $("errBox").innerHTML = `<div class="err">${msg}<br><button class="btn" type="button" id="retry">Prøv igen</button></div>`;
    $("retry").onclick = () => load(true);
  }

  let loading = false;
  async function load(force) {
    if (loading) return;
    const cached = store.get("prices2");
    if (!data && cached && cached.netId === netId()) { data = cached; render(); }
    const fresh = data && data.netId === netId() && Date.now() - data.fetched < MAX_AGE;
    if (fresh && !force) return;
    loading = true;
    try {
      await fetchPrices();
      $("errBox").hidden = true;
      render();
    } catch (e) {
      const msg = e.message === "rate"
        ? "For mange opdateringer på kort tid. Vent et kvarters tid, så virker det igen."
        : "Kunne ikke hente priser. Tjek din internetforbindelse.";
      if (data) render();
      showError(data ? msg + " Viser de senest hentede priser." : msg);
    } finally { loading = false; }
  }

  // ---------- events ----------
  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    tab = b.dataset.tab; render();
    if (tab === "usage") loadUsage(false);
  });
  $("panel").addEventListener("click", e => {
    const id = e.target.id;
    if (id === "tokSave") {
      const v = $("tokIn").value.replace(/\s+/g, "").replace(/^Bearer/i, "");
      if (!v) return;
      eloToken = v; store.set("eloToken", v); mpId = ""; use = null;
      loadUsage(true); return;
    }
    if (id === "tokForget") {
      eloToken = ""; mpId = ""; use = null; useErr = ""; mps = [];
      ["eloToken", "eloAccess", "eloMp", "eloMps", "use"].forEach(k => localStorage.removeItem(k));
      render(); return;
    }
    if (id === "useRefresh" || id === "useRetry") { loadUsage(true); return; }
    const u = e.target.closest(".drow.use");
    if (u) {
      const d = u.dataset.uday;
      if (openUseDays.has(d)) openUseDays.delete(d); else openUseDays.add(d);
      render(); return;
    }
    const r = e.target.closest(".drow"); if (!r) return;
    const day = r.dataset.day;
    if (openDays.has(day)) openDays.delete(day); else openDays.add(day);
    render();
  });

  $("panel").addEventListener("change", e => {
    if (e.target.id === "mpSel") { mpId = e.target.value; store.set("eloMp", mpId); loadUsage(false); }
  });

  document.querySelector(".seg").addEventListener("click", e => {
    const b = e.target.closest("button[data-area]"); if (!b || b.dataset.area === area) return;
    area = b.dataset.area; store.set("area", area); data = null;
    render(); load(true);
    if (tab === "usage") loadUsage(false);
  });
  $("heatChk").addEventListener("change", () => { heat = $("heatChk").checked; store.set("heat", heat); render(); });

  document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(false); render(); if (tab === "usage") loadUsage(false); } });
  setInterval(() => { if (!document.hidden) render(); }, 60e3);

  render();
  load(false);
})();
</script>
</body>
</html>
